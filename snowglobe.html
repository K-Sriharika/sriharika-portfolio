<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Snowglobe Simulator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      --bg: #0b1020;
      --panel-bg: #111624;
      --accent: #5fd1ff;
      --accent-soft: rgba(95, 209, 255, 0.25);
      --border-soft: rgba(255, 255, 255, 0.12);
      --text-main: #f7f9ff;
      --text-muted: #a8b0d0;
      --danger: #ff6b81;
      --radius-lg: 18px;
      --radius-md: 12px;
      --radius-sm: 999px;
      --shadow-soft: 0 18px 45px rgba(0, 0, 0, 0.55);
      --transition-fast: 150ms ease-out;
      --transition-med: 220ms ease-out;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
      background: radial-gradient(circle at top, #202a4a 0, #050712 55%, #02030a 100%);
      color: var(--text-main);
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .app-shell {
      width: min(960px, 100%);
      max-height: 720px;
      background: radial-gradient(circle at top left, #1e2642, #050712 58%, #02030a 100%);
      border-radius: 24px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      box-shadow: var(--shadow-soft);
      display: grid;
      grid-template-columns: minmax(0, 3fr) minmax(260px, 2fr);
      gap: 0;
      overflow: hidden;
      position: relative;
    }

    @media (max-width: 780px) {
      .app-shell {
        grid-template-columns: minmax(0, 1fr);
        grid-template-rows: auto auto;
        max-height: none;
      }
    }

    .app-main {
      position: relative;
      padding: 20px 20px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      isolation: isolate;
    }

    .app-main::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at top, rgba(95, 209, 255, 0.12), transparent 55%);
      opacity: 0.9;
      pointer-events: none;
      z-index: -1;
    }

    .app-sidebar {
      background: linear-gradient(145deg, rgba(4, 6, 18, 0.96), rgba(7, 11, 31, 0.98));
      border-left: 1px solid rgba(255, 255, 255, 0.04);
      padding: 18px 18px 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    @media (max-width: 780px) {
      .app-sidebar {
        border-left: none;
        border-top: 1px solid rgba(255, 255, 255, 0.05);
      }
    }

    .app-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      margin-bottom: 4px;
      gap: 12px;
    }

    .app-title {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .app-title h1 {
      font-size: 1.25rem;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      margin: 0;
      display: flex;
      align-items: center;
      gap: 0.4em;
    }

    .badge {
      font-size: 0.68rem;
      padding: 2px 8px;
      border-radius: 999px;
      border: 1px solid rgba(95, 209, 255, 0.6);
      background: rgba(7, 15, 30, 0.9);
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--accent);
    }

    .app-title p {
      margin: 0;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .hint {
      font-size: 0.75rem;
      color: var(--text-muted);
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      padding: 4px 10px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: linear-gradient(135deg, rgba(10, 16, 34, 0.95), rgba(8, 13, 29, 0.95));
    }

    .hint kbd {
      font-family: inherit;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      padding: 1px 6px;
      background: rgba(4, 7, 18, 0.9);
      font-size: 0.7rem;
      color: #e4ecff;
    }

    /* Globe container */
    .globe-wrapper {
      width: 100%;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6px 0 0;
    }

    .globe {
      position: relative;
      width: min(360px, 100%);
      aspect-ratio: 1 / 1.05;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .globe-glass {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 10%, rgba(255, 255, 255, 0.55) 0, rgba(255, 255, 255, 0.15) 12%, rgba(255, 255, 255, 0.04) 26%, rgba(5, 10, 25, 0.98) 60%, rgba(2, 3, 10, 1) 100%),
                  radial-gradient(circle at 70% 80%, rgba(95, 209, 255, 0.3) 0, transparent 45%);
      box-shadow:
        0 18px 45px rgba(0, 0, 0, 0.85),
        inset 0 0 0 1px rgba(255, 255, 255, 0.14),
        inset 0 0 35px rgba(255, 255, 255, 0.12);
      overflow: hidden;
      transform-origin: center bottom;
      transition: transform 220ms cubic-bezier(0.18, 0.89, 0.32, 1.28),
                  box-shadow 220ms ease-out;
    }

    .globe.shaking .globe-glass {
      animation: wobble 650ms cubic-bezier(0.18, 0.89, 0.32, 1.28);
    }

    @keyframes wobble {
      0% { transform: rotate(0deg) translateY(0); }
      10% { transform: rotate(-6deg) translateY(-4px); }
      26% { transform: rotate(5deg) translateY(-2px); }
      40% { transform: rotate(-3deg) translateY(-1px); }
      55% { transform: rotate(2deg) translateY(0); }
      72% { transform: rotate(-1deg); }
      100% { transform: rotate(0deg); }
    }

    .globe-inner {
      position: absolute;
      inset: 10% 7% 18%;
      border-radius: 50%;
      overflow: hidden;
      background: radial-gradient(circle at 50% 0%, rgba(255, 255, 255, 0.08), transparent 45%),
                  linear-gradient(to top, #050712 0, #050816 60%, #080c1c 100%);
    }

    .globe-fog {
      position: absolute;
      inset: -10%;
      background: radial-gradient(circle at 50% 0%, rgba(255, 255, 255, 0.18) 0, transparent 45%),
                  radial-gradient(circle at 10% 10%, rgba(255, 255, 255, 0.22) 0, transparent 30%),
                  radial-gradient(circle at 90% 15%, rgba(255, 255, 255, 0.15) 0, transparent 26%);
      mix-blend-mode: screen;
      opacity: 0.6;
      pointer-events: none;
    }

    .globe-halo {
      position: absolute;
      inset: 8%;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.14);
      box-shadow:
        0 0 18px rgba(95, 209, 255, 0.45),
        0 0 32px rgba(95, 209, 255, 0.24);
      opacity: 0.35;
      pointer-events: none;
    }

    .globe-base {
      width: 74%;
      height: 20%;
      margin-top: -2%;
      background: linear-gradient(135deg, #0a0b16, #16192b 35%, #0d1020 70%, #050712 100%);
      border-radius: 999px 999px 12px 12px;
      box-shadow:
        0 16px 30px rgba(0, 0, 0, 0.9),
        inset 0 1px 0 rgba(255, 255, 255, 0.08);
      position: relative;
      padding: 6px 14px 10px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .globe-base::before {
      content: "";
      position: absolute;
      inset: 4px 10px auto;
      height: 32%;
      border-radius: 999px;
      background: radial-gradient(circle at 50% 0%, rgba(255, 255, 255, 0.38) 0, rgba(255, 255, 255, 0.1) 38%, transparent 65%);
      opacity: 0.7;
      pointer-events: none;
    }

    .plaque {
      position: relative;
      align-self: center;
      min-width: 90px;
      max-width: 60%;
      padding: 3px 10px;
      border-radius: 999px;
      background: linear-gradient(145deg, #f4e4c0, #fef7dc 40%, #e9d09c 70%, #fdf0c5 100%);
      box-shadow:
        inset 0 0 0 1px rgba(255, 255, 255, 0.6),
        0 2px 4px rgba(0, 0, 0, 0.55);
      text-align: center;
      font-size: 0.7rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #5b4a26;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .base-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.7rem;
      color: rgba(220, 230, 255, 0.7);
      padding: 0 2px;
      margin-top: 2px;
    }

    .meta-pill {
      padding: 1px 7px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: rgba(4, 7, 18, 0.8);
      backdrop-filter: blur(6px);
    }

    /* Scene content */
    .scene {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding: 0 16px 18px;
    }

    .ground {
      position: absolute;
      left: -5%;
      right: -5%;
      bottom: 8%;
      height: 24%;
      border-radius: 50% 50% 45% 45%;
      background: radial-gradient(circle at 50% 0, #ffffff 0, #f8fbff 36%, #e1e7ff 70%, #c2c9ea 100%);
      box-shadow:
        0 -8px 16px rgba(2, 3, 10, 0.9),
        inset 0 1px 0 rgba(255, 255, 255, 0.9);
      transform: translateY(12%);
    }

    .ground::before {
      content: "";
      position: absolute;
      inset: 8% 14% auto;
      height: 40%;
      border-radius: 50%;
      background: radial-gradient(circle at 50% 0, rgba(255, 255, 255, 0.85) 0, transparent 70%);
      opacity: 0.85;
    }

    .scene-content {
      position: relative;
      width: 100%;
      max-width: 240px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 18px;
      z-index: 2;
    }

    /* Tree scene */
    .tree {
      position: relative;
      width: 74px;
      height: 110px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }

    .tree-trunk {
      position: absolute;
      bottom: 0;
      width: 16px;
      height: 26px;
      border-radius: 4px;
      background: linear-gradient(to bottom, #4b321c, #2c1d11);
      box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.25);
    }

    .tree-layer {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      border-radius: 50% 50% 50% 50%;
      background: radial-gradient(circle at 50% 0, #f7fbff 0, #a5d7b9 32%, #2a6b4b 70%, #123524 100%);
      box-shadow: 0 6px 12px rgba(0, 0, 0, 0.3);
    }

    .tree-layer:nth-child(1) {
      bottom: 22px;
      width: 74px;
      height: 46px;
    }

    .tree-layer:nth-child(2) {
      bottom: 44px;
      width: 56px;
      height: 40px;
    }

    .tree-layer:nth-child(3) {
      bottom: 64px;
      width: 40px;
      height: 32px;
    }

    .tree-star {
      position: absolute;
      bottom: 90px;
      width: 18px;
      height: 18px;
      background: radial-gradient(circle at 50% 50%, #fff5cf 0, #ffe18a 40%, #f6b94a 75%, #f0a826 100%);
      clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
      filter: drop-shadow(0 0 6px rgba(255, 225, 138, 0.9));
    }

    .tree-lights span {
      position: absolute;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #ffd447;
      box-shadow: 0 0 8px rgba(255, 212, 71, 0.9);
      opacity: 0.8;
      animation: twinkle 1.8s ease-in-out infinite alternate;
    }

    .tree-lights span:nth-child(1) { bottom: 30px; left: 22px; animation-delay: 0s; }
    .tree-lights span:nth-child(2) { bottom: 36px; right: 20px; animation-delay: 0.4s; }
    .tree-lights span:nth-child(3) { bottom: 50px; left: 30px; animation-delay: 0.8s; }
    .tree-lights span:nth-child(4) { bottom: 60px; right: 26px; animation-delay: 1.2s; }

    @keyframes twinkle {
      0% { opacity: 0.4; transform: scale(0.9); }
      100% { opacity: 1; transform: scale(1.1); }
    }

    /* House scene */
    .house {
      position: relative;
      width: 110px;
      height: 80px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }

    .house-body {
      position: absolute;
      bottom: 0;
      width: 100px;
      height: 52px;
      border-radius: 8px;
      background: linear-gradient(135deg, #f7f3f0, #e4d9d0);
      box-shadow:
        0 8px 12px rgba(0, 0, 0, 0.35),
        0 0 0 1px rgba(0, 0, 0, 0.18);
    }

    .house-roof {
      position: absolute;
      bottom: 38px;
      width: 112px;
      height: 40px;
      border-radius: 6px 6px 14px 14px;
      background: linear-gradient(to bottom, #b33a3a, #6e1717);
      transform: skewX(-8deg);
      box-shadow: 0 6px 10px rgba(0, 0, 0, 0.4);
    }

    .house-roof::before {
      content: "";
      position: absolute;
      inset: 4px 4px auto;
      height: 14px;
      border-radius: 10px;
      background: radial-gradient(circle at 50% 0, #ffffff 0, #f4f4f4 45%, #e0e0e0 100%);
    }

    .house-door {
      position: absolute;
      bottom: 0;
      left: 17px;
      width: 26px;
      height: 34px;
      border-radius: 6px 6px 2px 2px;
      background: linear-gradient(135deg, #845638, #4b2c1a);
      box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.25);
    }

    .house-door::before {
      content: "";
      position: absolute;
      right: 6px;
      top: 16px;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: #f7e3b7;
    }

    .house-window {
      position: absolute;
      bottom: 16px;
      right: 20px;
      width: 24px;
      height: 20px;
      border-radius: 6px;
      background: radial-gradient(circle at 30% 10%, #fffdf6 0, #ffe7ab 40%, #ffcf75 80%);
      box-shadow:
        0 0 14px rgba(255, 222, 135, 0.85),
        0 0 0 1px rgba(255, 255, 255, 0.55);
    }

    .chimney {
      position: absolute;
      bottom: 64px;
      right: 30px;
      width: 16px;
      height: 26px;
      border-radius: 3px 3px 0 0;
      background: linear-gradient(145deg, #c9b5a2, #9b7f64);
      box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.25);
    }

    .smoke {
      position: absolute;
      bottom: 84px;
      right: 32px;
      width: 40px;
      height: 60px;
      pointer-events: none;
    }

    .smoke span {
      position: absolute;
      bottom: 0;
      left: 50%;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.9) 0, rgba(255, 255, 255, 0.4) 40%, transparent 70%);
      opacity: 0.75;
      transform: translateX(-50%);
      animation: smoke-rise 4s ease-in-out infinite;
    }

    .smoke span:nth-child(2) {
      animation-delay: 1s;
      width: 20px;
      height: 20px;
    }

    .smoke span:nth-child(3) {
      animation-delay: 2s;
      width: 16px;
      height: 16px;
    }

    @keyframes smoke-rise {
      0% { transform: translate(-50%, 0) scale(0.7); opacity: 0; }
      10% { opacity: 0.7; }
      70% { transform: translate(-50%, -28px) scale(1.1); opacity: 0.5; }
      100% { transform: translate(-50%, -40px) scale(1.25); opacity: 0; }
    }

    /* Snowman scene */
    .snowman {
      position: relative;
      width: 90px;
      height: 90px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }

    .snowman-body-large,
    .snowman-body-mid,
    .snowman-head {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 20%, #ffffff 0, #f5f7ff 40%, #d9e0ff 85%);
      box-shadow: 0 6px 12px rgba(0, 0, 0, 0.3);
    }

    .snowman-body-large {
      bottom: 0;
      width: 52px;
      height: 52px;
    }

    .snowman-body-mid {
      bottom: 32px;
      width: 38px;
      height: 38px;
    }

    .snowman-head {
      bottom: 58px;
      width: 30px;
      height: 30px;
    }

    .snowman-face-eye {
      position: absolute;
      top: 12px;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: #22252f;
    }

    .snowman-face-eye.left { left: 9px; }
    .snowman-face-eye.right { right: 9px; }

    .snowman-nose {
      position: absolute;
      top: 15px;
      left: 50%;
      width: 12px;
      height: 4px;
      background: linear-gradient(90deg, #fcd29f, #f98b2a);
      border-radius: 999px;
      transform-origin: left center;
      transform: translateX(0) rotate(4deg);
      box-shadow: 0 0 3px rgba(249, 139, 42, 0.8);
    }

    .snowman-buttons span {
      position: absolute;
      left: 50%;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: #22252f;
      transform: translateX(-50%);
    }

    .snowman-buttons span:nth-child(1) { bottom: 42px; }
    .snowman-buttons span:nth-child(2) { bottom: 35px; }
    .snowman-buttons span:nth-child(3) { bottom: 28px; }

    .snowman-arms span {
      position: absolute;
      bottom: 46px;
      width: 24px;
      height: 2px;
      background: #553424;
      transform-origin: 0 50%;
    }

    .snowman-arms span.left {
      left: 50%;
      transform: rotate(170deg);
    }

    .snowman-arms span.right {
      right: 50%;
      transform: rotate(10deg);
    }

    .snowman-hat {
      position: absolute;
      bottom: 80px;
      width: 28px;
      height: 10px;
      border-radius: 999px;
      background: #1b1c26;
      box-shadow: 0 3px 4px rgba(0, 0, 0, 0.5);
    }

    .snowman-hat::before {
      content: "";
      position: absolute;
      inset: -18px 4px auto;
      height: 18px;
      border-radius: 5px 5px 2px 2px;
      background: linear-gradient(145deg, #151623, #26283a);
      box-shadow: 0 3px 4px rgba(0, 0, 0, 0.6);
    }

    .snowman-hat::after {
      content: "";
      position: absolute;
      inset: -8px 6px auto;
      height: 5px;
      border-radius: 999px;
      background: linear-gradient(90deg, #ff6b81, #ff9f9a);
    }

    /* Snowfall */
    .snow-layer {
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .snowflake {
      position: absolute;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #ffffff 0, #e5f1ff 40%, #c7d8ff 100%);
      opacity: 0.85;
      box-shadow:
        0 0 6px rgba(255, 255, 255, 0.85),
        0 0 10px rgba(167, 211, 255, 0.8);
      will-change: transform;
    }

    /* Controls */
    .section-label {
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .control-group {
      border-radius: var(--radius-md);
      border: 1px solid var(--border-soft);
      background: radial-gradient(circle at top left, rgba(95, 209, 255, 0.12), transparent 55%),
                  rgba(5, 9, 22, 0.96);
      padding: 10px 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .scene-buttons {
      display: flex;
      gap: 6px;
    }

    .chip {
      flex: 1;
      border-radius: var(--radius-sm);
      border: 1px solid rgba(255, 255, 255, 0.16);
      padding: 6px 8px;
      font-size: 0.78rem;
      color: var(--text-muted);
      background: radial-gradient(circle at top left, rgba(255, 255, 255, 0.06), transparent 55%),
                  rgba(4, 7, 18, 0.9);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: border-color var(--transition-fast),
                  background var(--transition-fast),
                  color var(--transition-fast),
                  box-shadow var(--transition-fast),
                  transform var(--transition-fast);
    }

    .chip span.icon {
      font-size: 0.9rem;
      opacity: 0.8;
    }

    .chip[aria-pressed="true"] {
      color: #e9f6ff;
      border-color: rgba(95, 209, 255, 0.9);
      background: radial-gradient(circle at top left, rgba(95, 209, 255, 0.2), transparent 55%),
                  linear-gradient(135deg, rgba(12, 23, 46, 0.9), rgba(7, 14, 30, 0.95));
      box-shadow: 0 0 0 1px rgba(95, 209, 255, 0.4);
    }

    .chip:hover {
      border-color: rgba(255, 255, 255, 0.3);
      transform: translateY(-1px);
    }

    .chip:focus-visible,
    .slider-input:focus-visible,
    .range-input:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .slider-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .slider-label {
      font-size: 0.8rem;
      color: var(--text-muted);
      min-width: 58px;
    }

    .range-input {
      flex: 1;
      appearance: none;
      height: 4px;
      border-radius: 999px;
      background: linear-gradient(90deg, rgba(95, 209, 255, 0.2), rgba(95, 209, 255, 0.7));
      outline: none;
      cursor: pointer;
    }

    .range-input::-webkit-slider-thumb {
      appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #f5fbff;
      border: 1px solid rgba(26, 40, 68, 0.85);
      box-shadow:
        0 0 0 4px rgba(95, 209, 255, 0.28),
        0 3px 6px rgba(0, 0, 0, 0.6);
      transition: box-shadow var(--transition-fast), transform var(--transition-fast);
    }

    .range-input::-moz-range-thumb {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #f5fbff;
      border: 1px solid rgba(26, 40, 68, 0.85);
      box-shadow:
        0 0 0 4px rgba(95, 209, 255, 0.28),
        0 3px 6px rgba(0, 0, 0, 0.6);
    }

    .range-input:active::-webkit-slider-thumb {
      transform: scale(1.05);
      box-shadow:
        0 0 0 6px rgba(95, 209, 255, 0.4),
        0 4px 8px rgba(0, 0, 0, 0.8);
    }

    .range-value {
      min-width: 34px;
      text-align: right;
      font-variant-numeric: tabular-nums;
      font-size: 0.78rem;
      color: var(--text-main);
    }

    .wind-legend {
      display: flex;
      justify-content: space-between;
      font-size: 0.7rem;
      color: var(--text-muted);
      margin-top: -5px;
    }

    .shake-button {
      border-radius: var(--radius-sm);
      border: 1px solid rgba(95, 209, 255, 0.7);
      padding: 8px 10px;
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      color: #e5f6ff;
      background: radial-gradient(circle at top left, rgba(95, 209, 255, 0.4), transparent 60%),
                  linear-gradient(135deg, #0e223a, #07111f);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow:
        0 0 0 1px rgba(95, 209, 255, 0.3),
        0 8px 18px rgba(0, 0, 0, 0.7);
      transition: transform var(--transition-med),
                  box-shadow var(--transition-med),
                  background var(--transition-med);
    }

    .shake-button:hover {
      transform: translateY(-1px);
      box-shadow:
        0 0 0 1px rgba(95, 209, 255, 0.6),
        0 10px 24px rgba(0, 0, 0, 0.8);
    }

    .shake-button:active {
      transform: translateY(0);
      box-shadow:
        0 0 0 1px rgba(95, 209, 255, 0.5),
        0 4px 12px rgba(0, 0, 0, 0.8);
    }

    .shake-icon {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 2px solid rgba(95, 209, 255, 0.9);
      border-top-color: transparent;
      border-right-color: transparent;
      transform: rotate(-45deg);
      position: relative;
    }

    .shake-icon::before {
      content: "";
      position: absolute;
      inset: 2px;
      border-radius: 50%;
      border: 1px solid rgba(95, 209, 255, 0.6);
      opacity: 0.85;
    }

    .shake-button[aria-pressed="true"] .shake-icon {
      animation: spin 600ms linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(315deg); }
    }

    .footer-note {
      font-size: 0.7rem;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
      gap: 6px;
    }

    .footer-note span {
      opacity: 0.8;
    }

    .footer-note strong {
      font-weight: 600;
      color: #e7f0ff;
    }
  </style>
</head>
<body>
  <div class="app-shell" role="application" aria-label="Interactive snowglobe simulator">
    <main class="app-main">
      <header class="app-header">
        <div class="app-title">
          <h1>
            Snowglobe Studio
            <span class="badge">Client-side</span>
          </h1>
          <p>Click the globe or press the button to shake. Adjust the scene, wind, and snowfall.</p>
        </div>
        <div class="hint" aria-hidden="true">
          Tip: Click the globe to shake
          <kbd>Space</kbd>
        </div>
      </header>

      <section class="globe-wrapper">
        <button class="globe" id="globe" aria-label="Snowglobe. Click to shake" type="button">
          <div class="globe-glass">
            <div class="globe-inner" aria-hidden="true">
              <div class="scene" id="scene">
                <div class="ground"></div>
                <div class="scene-content" id="sceneContent">
                  <!-- Scene elements injected by JS -->
                </div>
              </div>
              <div class="snow-layer" id="snowLayer"></div>
            </div>
            <div class="globe-fog"></div>
            <div class="globe-halo"></div>
          </div>
          <div class="globe-base" aria-hidden="true">
            <div class="plaque" id="plaqueLabel">Evergreen Valley</div>
            <div class="base-meta">
              <span class="meta-pill" id="metaWind">Wind: Calm</span>
              <span class="meta-pill" id="metaSnow">Snow: 120 flakes</span>
            </div>
          </div>
        </button>
      </section>
    </main>

    <aside class="app-sidebar" aria-label="Snowglobe controls">
      <section>
        <div class="section-label">Scene</div>
        <div class="control-group" role="radiogroup" aria-label="Snowglobe scene">
          <div class="scene-buttons">
            <button class="chip" type="button" data-scene="tree" aria-pressed="true">
              <span class="icon" aria-hidden="true">🎄</span>
              Tree
            </button>
            <button class="chip" type="button" data-scene="house" aria-pressed="false">
              <span class="icon" aria-hidden="true">🏠</span>
              House
            </button>
            <button class="chip" type="button" data-scene="snowman" aria-pressed="false">
              <span class="icon" aria-hidden="true">⛄</span>
              Snowman
            </button>
          </div>
        </div>
      </section>

      <section>
        <div class="section-label">Atmosphere</div>
        <div class="control-group">
          <div class="slider-row">
            <label class="slider-label" for="windRange">Wind</label>
            <input
              id="windRange"
              class="range-input"
              type="range"
              min="-100"
              max="100"
              value="0"
              step="5"
              aria-label="Wind direction and strength"
            />
            <div class="range-value" id="windValue">Calm</div>
          </div>
          <div class="wind-legend" aria-hidden="true">
            <span>Left</span>
            <span>Calm</span>
            <span>Right</span>
          </div>

          <div class="slider-row">
            <label class="slider-label" for="snowRange">Snow</label>
            <input
              id="snowRange"
              class="range-input"
              type="range"
              min="40"
              max="260"
              value="120"
              step="10"
              aria-label="Snowfall density"
            />
            <div class="range-value" id="snowValue">120</div>
          </div>
        </div>
      </section>

      <section>
        <div class="section-label">Shake</div>
        <div class="control-group">
          <button id="shakeButton" class="shake-button" type="button" aria-pressed="false">
            <span class="shake-icon" aria-hidden="true"></span>
            <span>Shake Globe</span>
          </button>
          <p class="footer-note">
            <span>Shake intensity scales with snow density.</span>
            <span><strong>All client-side</strong> · No network calls.</span>
          </p>
        </div>
      </section>
    </aside>
  </div>

  <script>
    (function () {
      const globe = document.getElementById('globe');
      const snowLayer = document.getElementById('snowLayer');
      const sceneContent = document.getElementById('sceneContent');
      const plaqueLabel = document.getElementById('plaqueLabel');
      const metaWind = document.getElementById('metaWind');
      const metaSnow = document.getElementById('metaSnow');

      const windRange = document.getElementById('windRange');
      const snowRange = document.getElementById('snowRange');
      const windValueLabel = document.getElementById('windValue');
      const snowValueLabel = document.getElementById('snowValue');
      const shakeButton = document.getElementById('shakeButton');

      const sceneButtons = Array.from(document.querySelectorAll('.chip[data-scene]'));

      let currentScene = 'tree';
      let snowflakes = [];
      let animationFrameId = null;
      let lastTimestamp = 0;
      let windFactor = 0; // -1 to 1
      let isShaking = false;

      const SCENE_LABELS = {
        tree: 'Evergreen Valley',
        house: 'Winter Cottage',
        snowman: 'Frosty Friend'
      };

      function createScene(scene) {
        sceneContent.innerHTML = '';

        if (scene === 'tree') {
          const tree = document.createElement('div');
          tree.className = 'tree';

          const trunk = document.createElement('div');
          trunk.className = 'tree-trunk';
          tree.appendChild(trunk);

          const layer1 = document.createElement('div');
          const layer2 = document.createElement('div');
          const layer3 = document.createElement('div');
          layer1.className = 'tree-layer';
          layer2.className = 'tree-layer';
          layer3.className = 'tree-layer';
          tree.appendChild(layer1);
          tree.appendChild(layer2);
          tree.appendChild(layer3);

          const star = document.createElement('div');
          star.className = 'tree-star';
          tree.appendChild(star);

          const lights = document.createElement('div');
          lights.className = 'tree-lights';
          for (let i = 0; i < 4; i++) {
            const dot = document.createElement('span');
            lights.appendChild(dot);
          }
          tree.appendChild(lights);

          sceneContent.appendChild(tree);
        } else if (scene === 'house') {
          const house = document.createElement('div');
          house.className = 'house';

          const body = document.createElement('div');
          body.className = 'house-body';
          const roof = document.createElement('div');
          roof.className = 'house-roof';
          const door = document.createElement('div');
          door.className = 'house-door';
          const windowEl = document.createElement('div');
          windowEl.className = 'house-window';
          const chimney = document.createElement('div');
          chimney.className = 'chimney';

          const smoke = document.createElement('div');
          smoke.className = 'smoke';
          for (let i = 0; i < 3; i++) {
            const puff = document.createElement('span');
            smoke.appendChild(puff);
          }

          house.appendChild(body);
          house.appendChild(roof);
          house.appendChild(door);
          house.appendChild(windowEl);
          house.appendChild(chimney);
          house.appendChild(smoke);

          sceneContent.appendChild(house);
        } else if (scene === 'snowman') {
          const snowman = document.createElement('div');
          snowman.className = 'snowman';

          const large = document.createElement('div');
          large.className = 'snowman-body-large';
          const mid = document.createElement('div');
          mid.className = 'snowman-body-mid';
          const head = document.createElement('div');
          head.className = 'snowman-head';

          const eyeLeft = document.createElement('div');
          eyeLeft.className = 'snowman-face-eye left';
          const eyeRight = document.createElement('div');
          eyeRight.className = 'snowman-face-eye right';
          const nose = document.createElement('div');
          nose.className = 'snowman-nose';

          head.appendChild(eyeLeft);
          head.appendChild(eyeRight);
          head.appendChild(nose);

          const buttons = document.createElement('div');
          buttons.className = 'snowman-buttons';
          for (let i = 0; i < 3; i++) {
            const btn = document.createElement('span');
            buttons.appendChild(btn);
          }

          const arms = document.createElement('div');
          arms.className = 'snowman-arms';
          const armLeft = document.createElement('span');
          armLeft.className = 'left';
          const armRight = document.createElement('span');
          armRight.className = 'right';
          arms.appendChild(armLeft);
          arms.appendChild(armRight);

          const hat = document.createElement('div');
          hat.className = 'snowman-hat';

          snowman.appendChild(large);
          snowman.appendChild(mid);
          snowman.appendChild(head);
          snowman.appendChild(buttons);
          snowman.appendChild(arms);
          snowman.appendChild(hat);

          sceneContent.appendChild(snowman);
        }
      }

      function createSnowflakes(count) {
        snowLayer.innerHTML = '';
        snowflakes = [];

        const rect = snowLayer.getBoundingClientRect();
        const width = rect.width || 300;
        const height = rect.height || 300;

        for (let i = 0; i < count; i++) {
          const el = document.createElement('div');
          el.className = 'snowflake';

          const size = 2 + Math.random() * 3;
          const x = Math.random() * width;
          const y = Math.random() * height;

          const speed = 15 + Math.random() * 22; // px per second
          const swayAmplitude = 6 + Math.random() * 10;
          const swayFrequency = 0.6 + Math.random() * 0.8;

          const depth = 0.4 + Math.random() * 0.6;
          const opacity = 0.5 + depth * 0.5;

          el.style.width = size + 'px';
          el.style.height = size + 'px';
          el.style.opacity = String(opacity.toFixed(2));

          snowLayer.appendChild(el);

          snowflakes.push({
            el,
            x,
            y,
            baseX: x,
            speed,
            swayAmplitude,
            swayFrequency,
            depth,
            size
          });
        }
      }

      function updateWindMeta(value) {
        let label = 'Calm';
        const abs = Math.abs(value);
        if (abs > 10 && abs <= 40) label = 'Breeze';
        else if (abs > 40 && abs <= 70) label = 'Gusty';
        else if (abs > 70) label = 'Blustery';

        const direction = value === 0 ? '' : value < 0 ? ' (left)' : ' (right)';
        metaWind.textContent = 'Wind: ' + label + direction;
      }

      function updateSnowMeta(count) {
        metaSnow.textContent = 'Snow: ' + count + ' flakes';
      }

      function updateWindLabel(value) {
        if (value === 0) {
          windValueLabel.textContent = 'Calm';
        } else if (value < 0) {
          windValueLabel.textContent = Math.abs(value) + ' ←';
        } else {
          windValueLabel.textContent = value + ' →';
        }
      }

      function updateSnowLabel(count) {
        snowValueLabel.textContent = String(count);
      }

      function animate(timestamp) {
        if (!lastTimestamp) lastTimestamp = timestamp;
        const dt = (timestamp - lastTimestamp) / 1000;
        lastTimestamp = timestamp;

        const rect = snowLayer.getBoundingClientRect();
        const width = rect.width || 300;
        const height = rect.height || 300;

        const baseFallSpeed = 25; // px/s baseline

        for (let i = 0; i < snowflakes.length; i++) {
          const flake = snowflakes[i];
          const fallSpeed = baseFallSpeed * flake.depth + flake.speed * 0.3;

          flake.y += fallSpeed * dt;

          const sway = Math.sin(timestamp / 1000 * flake.swayFrequency + i) * flake.swayAmplitude;
          const windOffset = windFactor * 45 * flake.depth; // horizontal drift from wind
          const x = flake.baseX + sway + windOffset;

          if (flake.y > height + 20) {
            flake.y = -20 - Math.random() * 20;
            flake.baseX = Math.random() * width;
          }

          flake.el.style.transform = 'translate(' + x.toFixed(1) + 'px, ' + flake.y.toFixed(1) + 'px)';
        }

        animationFrameId = requestAnimationFrame(animate);
      }

      function startAnimation() {
        if (animationFrameId == null) {
          lastTimestamp = 0;
          animationFrameId = requestAnimationFrame(animate);
        }
      }

      function stopAnimation() {
        if (animationFrameId != null) {
          cancelAnimationFrame(animationFrameId);
          animationFrameId = null;
        }
      }

      function triggerShake() {
        if (isShaking) return;
        isShaking = true;
        globe.classList.add('shaking');
        shakeButton.setAttribute('aria-pressed', 'true');

        const currentCount = parseInt(snowRange.value, 10) || 120;
        const extra = Math.min(120, Math.max(0, currentCount - 60));
        const duration = 700 + extra * 2;

        setTimeout(function () {
          globe.classList.remove('shaking');
          shakeButton.setAttribute('aria-pressed', 'false');
          isShaking = false;
        }, duration);

        const rect = snowLayer.getBoundingClientRect();
        const height = rect.height || 300;
        for (let i = 0; i < snowflakes.length; i++) {
          const flake = snowflakes[i];
          const randY = -40 - Math.random() * height * 0.6;
          flake.y = randY;
        }
      }

      function handleSceneChange(scene) {
        if (scene === currentScene) return;
        currentScene = scene;

        sceneButtons.forEach(function (btn) {
          const isActive = btn.getAttribute('data-scene') === scene;
          btn.setAttribute('aria-pressed', isActive ? 'true' : 'false');
        });

        createScene(scene);
        plaqueLabel.textContent = SCENE_LABELS[scene] || 'Snowglobe';
      }

      function handleWindChange() {
        const value = parseInt(windRange.value, 10) || 0;
        windFactor = value / 100;
        updateWindLabel(value);
        updateWindMeta(value);
      }

      function handleSnowChange() {
        const count = parseInt(snowRange.value, 10) || 120;
        updateSnowLabel(count);
        updateSnowMeta(count);
        createSnowflakes(count);
      }

      function handleKeydown(event) {
        if (event.code === 'Space') {
          event.preventDefault();
          triggerShake();
        }
      }

      sceneButtons.forEach(function (btn) {
        btn.addEventListener('click', function () {
          const scene = btn.getAttribute('data-scene');
          if (scene) handleSceneChange(scene);
        });
      });

      windRange.addEventListener('input', handleWindChange);
      snowRange.addEventListener('input', handleSnowChange);

      globe.addEventListener('click', function () {
        triggerShake();
      });

      shakeButton.addEventListener('click', function () {
        triggerShake();
      });

      window.addEventListener('keydown', handleKeydown);

      window.addEventListener('resize', function () {
        const count = parseInt(snowRange.value, 10) || 120;
        createSnowflakes(count);
      });

      // Initial setup
      createScene(currentScene);
      handleWindChange();
      handleSnowChange();
      startAnimation();
    })();
  </script>
</body>
</html>
