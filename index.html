  const t = el("a","tile"+(l.big?" big":"")); t.href = l.href;
  if(/^https?:/.test(l.href)){ t.target="_blank"; t.rel="noopener"; }
  t.innerHTML = `<div><div class="t-label">${l.label}</div><div class="t-sub">${l.sub}</div></div><div class="arrow">↗</div>`;
  document.getElementById("bento").appendChild(t);
});

/* ── rate card ── */

  <div class="ic-text"><b>30-min intro call</b><br>Let's get to know each other — no pressure.</div>
  <div class="ic-rate">${PORTFOLIO.introCallRate}</div>`;

PORTFOLIO.rates.forEach(r => {
  const c = el("div","rate"+(r.featured?" featured":""));
  c.innerHTML = `${r.featured?'<span class="badge">Most popular</span>':''}<div class="plan">${r.plan}</div><div class="price">${r.price}</div><div class="detail">${r.detail}</div>`;
  document.getElementById("rateGrid").appendChild(c);
});
document.getElementById("rateNote").textContent = PORTFOLIO.rateNote;

/* ── connect ── */

  document.getElementById("openBadges").appendChild(el("span","open-badge",a));
});
