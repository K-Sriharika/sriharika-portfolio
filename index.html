<style>
:root{ --bg:#111116; --surface:#181820; --surface-2:#1A1B22; --line:rgba(236,236,230,.1); --text:#ECECE6; --muted:#8E9099; --accent:#CDFF4D; --accent-ink:#0B0B0D; --serif:"Fraunces",serif; --sans:"Hanken Grotesk",sans-serif; --mono:"JetBrains Mono",monospace; --maxw:1120px; }
*{margin:0;padding:0;box-sizing:border-box}
body{ background:var(--bg); color:var(--text); font-family:var(--sans); -webkit-font-smoothing:antialiased; }
.wrap{max-width:var(--maxw); margin:0 auto; padding:0 28px}
a{color:inherit; text-decoration:none}
.kicker{ font-family:var(--mono); font-size:12px; color:var(--accent); text-transform:uppercase; display:flex; align-items:center; gap:10px; margin-bottom:10px;}
.kicker::before{content:""; width:20px; height:1px; background:var(--accent)}

nav{ position:sticky; top:0; z-index:50; backdrop-filter:blur(10px); background:rgba(11,11,13,.6); border-bottom:1px solid var(--line); height:66px; display:flex; align-items:center;}
nav .wrap{ display:flex; width:100%; justify-content:space-between; align-items:center; }
.brand{ font-family:var(--serif); font-weight:900; font-size:20px; }

header{ padding:80px 0 40px; }
.hero-layout{ display:grid; grid-template-columns:1fr 300px; gap:40px; align-items:center; }
.hero-photo{ width:280px; height:280px; border-radius:24px; border:2px solid var(--accent); overflow:hidden; }
.hero-photo img{ width:100%; height:100%; object-fit:cover; }
h1.hero{ font-family:var(--serif); font-size:clamp(32px,5vw,56px); line-height:1.1; margin-bottom:20px; }
.hero-sub{ color:var(--muted); font-size:18px; margin-bottom:30px; max-width:600px; }

.stats{ display:grid; grid-template-columns:repeat(4,1fr); gap:1px; background:var(--line); margin-top:50px; border-radius:12px; overflow:hidden;}
.stat{ background:var(--surface); padding:20px; }
.stat .v{ font-family:var(--serif); font-weight:900; font-size:32px; }
.stat .l{ color:var(--muted); font-size:12px; }

section{ padding:80px 0; border-top:1px solid var(--line); }
.sec-head h2{ font-family:var(--serif); font-size:36px; margin-bottom:40px; }

.vibe-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(240px, 1fr)); gap:20px; }
.vibe-card{ background:var(--surface); border-radius:16px; border:1px solid var(--line); overflow:hidden; cursor:pointer; transition:transform 0.2s;}
.vibe-card:hover{ transform:translateY(-5px); border-color:var(--accent); }
.vibe-thumb{ aspect-ratio:16/9; background:#222; }
.vibe-thumb img{ width:100%; height:100%; object-fit:cover; }
.vibe-info{ padding:16px; }
.vibe-title{ font-weight:600; margin-bottom:5px; }
.vibe-desc{ font-size:13px; color:var(--muted); }

.btn{ padding:12px 24px; border-radius:100px; font-family:var(--mono); font-size:14px; font-weight:600; display:inline-block; }
.btn-primary{ background:var(--accent); color:var(--accent-ink); }

@media(max-width:800px){ .hero-layout{ grid-template-columns:1fr; } .hero-photo{ order:-1; margin:0 auto; } }
</style>
</head>
<body>

<nav>
  <div class="wrap">
    <a class="brand" href="#">K. SRIHARIKA</a>
    <a href="#connect" style="font-family:var(--mono); font-size:13px; border:1px solid var(--line); padding:8px 16px; border-radius:100px;">Contact</a>
  </div>
</nav>

<header>
  <div class="wrap">
    <div class="hero-layout">
      <div>
        <div class="kicker">AI Evaluation Expert</div>
        <h1 class="hero" id="heroHeadline"></h1>
        <p class="hero-sub" id="heroSub"></p>
        <a href="#vibe" class="btn btn-primary">View My Work</a>
      </div>
      <div class="hero-photo">
        <img id="heroPhoto" src="" alt="Sriharika">
      </div>
    </div>
    <div class="stats" id="statStrip"></div>
  </div>

<section id="vibe">

    <div class="sec-head">
      <span class="kicker">Interactive Project Library</span>

    <div class="vibe-grid" id="vibeGrid"></div>
  </div>
</section>

<section id="connect">
    <div class="wrap">

        <a id="emailBtn" class="btn btn-primary">Email Me</a>
      </div>
    </div>
</section>

<script>
/* --- 3. RENDER ENGINE --- */
const $ = s => document.querySelector(s);

// Hero
$('#heroHeadline').textContent = PORTFOLIO.hero.headline;
$('#heroSub').textContent = PORTFOLIO.hero.subline;
$('#heroPhoto').src = PORTFOLIO.photo;

// Stats
PORTFOLIO.stats.forEach(s => {
  const d = document.createElement('div');
  d.className = 'stat';
  d.innerHTML = `<div class="v">${s.value}</div><div class="l">${s.label}</div>`;
  $('#statStrip').appendChild(d);
});

// Vibe Coding (Fixed Redirects)
PORTFOLIO.vibeCoding.forEach(v => {
  const card = document.createElement('div');
  card.className = 'vibe-card';
  card.onclick = () => openVibeProject(v.link);
  card.innerHTML = `
    <div class="vibe-thumb"><img src="${v.img}"></div>
    <div class="vibe-info">
      <div style="font-size:10px; color:var(--accent); font-family:var(--mono)">${v.tag}</div>
      <div class="vibe-title">${v.title}</div>
      <div class="vibe-desc">${v.desc}</div>
      <div style="margin-top:10px; font-size:11px; color:var(--accent)">▶ Play Live</div>
    </div>
  `;
  $('#vibeGrid').appendChild(card);
});

// Connect
$('#connectNote').textContent = PORTFOLIO.connectNote;
$('#emailBtn').href = "mailto:" + PORTFOLIO.connectEmail;

</script>
</body>
</html>
