<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flappy Box Game</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #e0f7fa;
        }
        #gameContainer {
            position: relative;
            width: 800px;
            height: 600px;
            background: linear-gradient(to bottom, #b3e5fc, #e1f5fe);
            border: 5px solid #00796b;
            border-radius: 10px;
            overflow: hidden;
        }
        #player {
            position: absolute;
            width: 40px;
            height: 40px;
            background-color: #0288d1;
            border-radius: 5px;
            top: 280px;
            left: 100px;
        }
        .collectible {
            position: absolute;
            width: 20px;
            height: 20px;
            background-color: #ffeb3b;
            border-radius: 50%;
        }
        .hud {
            position: absolute;
            top: 10px;
            color: #263238;
            font-size: 18px;
        }
        #lives, #scoreTime {
            display: inline-block;
            padding: 5px 10px;
        }
        #lives {
            left: 10px;
        }
        #scoreTime {
            right: 10px;
        }
        .button {
            position: absolute;
            bottom: 20px;
            color: white;
            background-color: #00796b;
            border: none;
            border-radius: 5px;
            padding: 10px 20px;
            margin: 0 5px;
            cursor: pointer;
        }
        .button:hover {
            background-color: #004d40;
        }
        #start {
            left: 150px;
        }
        #jump {
            left: 250px;
        }
        #pause {
            left: 350px;
        }
        #reset {
            left: 450px;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <div id="player"></div>
        <div class="collectible" style="top: 100px; left: 600px;"></div>
        <div class="collectible" style="top: 300px; left: 700px;"></div>

        <div class="hud" id="lives">Player: You | Lives: ❤️❤️❤️</div>
        <div class="hud" id="scoreTime">Score: 0 | Time: 00:00</div>

        <button class="button" id="start">Start</button>
        <button class="button" id="jump">Jump</button>
        <button class="button" id="pause">Pause</button>
        <button class="button" id="reset">Reset</button>
    </div>

    <script>
        const player = document.getElementById('player');
        const collectibles = document.querySelectorAll('.collectible');
        const livesDisplay = document.getElementById('lives');
        const scoreTimeDisplay = document.getElementById('scoreTime');
        const startButton = document.getElementById('start');
        const jumpButton = document.getElementById('jump');
        const pauseButton = document.getElementById('pause');
        const resetButton = document.getElementById('reset');

        let isRunning = false;
        let isPaused = false;
        let gravity = 1.5;
        let jumpImpulse = -15;
        let playerVelocity = 0;
        let playerLives = 3;
        let score = 0;
        let timer = 0;
        let gameLoop;

        function updateHUD() {
            livesDisplay.innerHTML = `Player: You | Lives: ${'❤️'.repeat(playerLives)}`;
            scoreTimeDisplay.innerHTML = `Score: ${score} | Time: ${formatTime(timer)}`;
        }

        function formatTime(ms) {
            const minutes = String(Math.floor(ms / 60000)).padStart(2, '0');
            const seconds = String(Math.floor((ms % 60000) / 1000)).padStart(2, '0');
            return `${minutes}:${seconds}`;
        }

        function startGame() {
            if (!isRunning) {
                isRunning = true;
                isPaused = false;
                gameLoop = setInterval(() => {
                    if (!isPaused) {
                        updateGame();
                        timer += 100;
                        updateHUD();
                    }
                }, 100);
            }
        }

        function updateGame() {
            // Handle gravity
            playerVelocity += gravity;
            player.style.top = `${player.offsetTop + playerVelocity}px`;

            // Check if player hits the bottom
            if (player.offsetTop + player.offsetHeight >= gameContainer.offsetHeight) {
                playerLives--;
                updateHUD();
                if (playerLives <= 0) {
                    gameOver();
                }
                player.style.top = '280px';
                playerVelocity = 0;
            }

            // Move collectibles and check for collisions
            collectibles.forEach(collectible => {
                let newLeft = collectible.offsetLeft - 5;
                if (newLeft < 0) {
                    newLeft = gameContainer.offsetWidth - collectible.offsetWidth;
                    collectible.style.top = `${Math.random() * (gameContainer.offsetHeight - collectible.offsetHeight)}px`;
                }
                collectible.style.left = `${newLeft}px`;

                if (isColliding(player, collectible)) {
                    score++;
                    collectible.style.left = `${gameContainer.offsetWidth}px`;
                }
            });
        }

        function isColliding(rect1, rect2) {
            const rect1Bounds = rect1.getBoundingClientRect();
            const rect2Bounds = rect2.getBoundingClientRect();
            return !(
                rect1Bounds.right < rect2Bounds.left ||
                rect1Bounds.left > rect2Bounds.right ||
                rect1Bounds.bottom < rect2Bounds.top ||
                rect1Bounds.top > rect2Bounds.bottom
            );
        }

        function jump() {
            if (isRunning && !isPaused) {
                playerVelocity = jumpImpulse;
            }
        }

        function pauseGame() {
            isPaused = !isPaused;
        }

        function resetGame() {
            clearInterval(gameLoop);
            isRunning = false;
            isPaused = false;
            playerLives = 3;
            score = 0;
            timer = 0;
            player.style.top = '280px';
            playerVelocity = 0;
            collectibles.forEach(collectible => {
                collectible.style.left = `${600 + Math.random() * 200}px`;
                collectible.style.top = `${Math.random() * (gameContainer.offsetHeight - collectible.offsetHeight)}px`;
            });
            updateHUD();
        }

        function gameOver() {
            clearInterval(gameLoop);
            alert('Game Over! Your score was ' + score);
            resetGame();
        }

        startButton.addEventListener('click', startGame);
        jumpButton.addEventListener('click', jump);
        pauseButton.addEventListener('click', pauseGame);
        resetButton.addEventListener('click', resetGame);
    </script>
</body>
</html>
